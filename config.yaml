# HotpotQA configuration (config_2wikimultihop.yaml and config_musique.yaml
# differ only in their index paths). The values below are the ones the paper's
# runs used; the ablation flags (ehrag.use_hyperedges, compression.enabled) are
# overridden per run by --tag, see docs/tag-configurations.md.
#
# The hardware section is descriptive only: it records the machine the paper
# ran on (MacBook Pro, Apple M1, 16 GB) and is not read by the pipeline.
hardware:
  chip: "M1"
  ram_gb: 16
  max_corpus_tokens: 70000    

paths:
  data_dir: "./data"
  models_dir: "./models"
  results_dir: "./results"
  db_path: "./data/graph.duckdb"

nlp:
  spacy_model: "en_core_web_trf"     # use en_core_web_sm for fast dev iterations
  max_entities_per_passage: 100

embeddings:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dimension: 384
  batch_size: 32

ehrag:
  use_hyperedges: true
  birch_threshold: 0.5
  birch_branching_factor: 50
  semantic_top_k: 5
  decay_factor: 0.95
  # Expansion shaping, validated retrieval-only on 500 questions:
  # legacy expansion (all flags off) cost -10.4pts gold recall@20 vs base;
  # with these settings ehrag-retrieval = 64.5% recall vs base-legacy 60.4%.
  expand_seed_entities: false        # only exact NER query entities expand
  expansion_max_cluster: 20          # skip mega-clusters (BIRCH date bags: 762/757/594)
  expansion_weight: "inverse_size"   # 0.5*w split across the cluster, not 0.5*w each
  expansion_exclude_labels: ["DATE", "CARDINAL", "ORDINAL", "QUANTITY", "TIME", "PERCENT", "MONEY"]

vector_index:
  index_type: "IVF_PQ"
  nlist: 100
  m: 16
  nbits: 8
  nprobe: 10

ppr:
  alpha: 0.15
  max_iterations: 50
  convergence_threshold: 1.0e-6
  top_k_passages: 20
  # Cap the vector-seed pool at this fraction of restart mass when exact NER
  # matches exist (degree-1 name-lookalike seeds otherwise outweigh exact
  # entities; 0.15 lifts base gold recall@20 60.4% -> 64.3% on 500q).
  seed_mass_fraction: 0.15

compression:
  enabled: true
  method: "extractive_evidence"
  # 2048 cut the gold answer out of 13% of answerable questions (budget exhausts
  # rank-ordered at ~14/20 passages). 3072 keeps answerability within 1.5pts of
  # uncompressed while still deduping ~10% and hard-capping the prompt.
  max_tokens: 3072
  preserve_spans:
    - named_entities
    - numerical_values
    - noun_phrases

llm:
  # Paper generator (~4.5 GB). The generator-ablation runs swap in
  # mlx-community/Llama-3.2-{1B,3B}-Instruct-4bit via --model.
  model: "mlx-community/Meta-Llama-3.1-8B-Instruct-4bit"
  max_tokens: 512
  temperature: 0.1
  top_p: 0.9
  repetition_penalty: 1.1

evaluation:
  benchmarks:
    - "hotpotqa"
    - "2wikimultihop"
    - "musique"
  max_eval_samples: 500
